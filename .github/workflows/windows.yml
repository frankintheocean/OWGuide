name: Windows packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run content:validate
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --lib
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: npm run tauri -- build --bundles msi
        env:
          OWGUIDE_CONTENT_PUBLIC_KEY: ${{ vars.OWGUIDE_CONTENT_PUBLIC_KEY }}
      - run: python scripts/notices.py
      - run: choco install nsis --version=3.11 -y --no-progress
      - run: ./packaging/package.ps1
      - name: Native WebView2 offline and window checks
        run: node tests/windows-native.mjs
      - name: Clear native test portable data
        run: Remove-Item release/OWGuide-1.0.0-portable/OWGuideData -Recurse -Force
      - run: ./packaging/smoke.ps1
      - run: ./packaging/finish.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OWGuide-Windows-development-candidate
          path: |
            release/*.exe
            release/*.msi
            release/*.zip
            release/*.json
            release/*.txt
            test-results/native-windows/
          if-no-files-found: error
