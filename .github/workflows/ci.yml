name: Check and build
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run content:validate
      - run: npm run test
      - run: npm run build
      - name: Shared schema files are current
        shell: bash
        run: npm run schemas && git diff --exit-code -- content/*.schema.json
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --lib
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: npm audit --audit-level=moderate
      - run: cargo install cargo-audit --version 0.22.0 --locked
      - run: cargo audit --file src-tauri/Cargo.lock
      - run: npm run licenses
      - run: cargo install cargo-license --version 0.6.1 --locked
      - name: Rust license report
        shell: bash
        run: cd src-tauri && cargo license --json > ../rust-licenses.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build desktop binary
        run: npm run tauri -- build --no-bundle
        env:
          OWGUIDE_CONTENT_PUBLIC_KEY: ${{ vars.OWGUIDE_CONTENT_PUBLIC_KEY }}
      - name: Bundle Windows MSI from the compiled app
        if: runner.os == 'Windows'
        run: npm run tauri -- bundle --bundles msi
      - name: Windows third-party notices
        if: runner.os == 'Windows'
        run: python scripts/notices.py
      - name: Install pinned NSIS tool
        if: runner.os == 'Windows'
        run: choco install nsis --version=3.11 -y --no-progress
      - name: Prepare Windows installer and portable folder
        if: runner.os == 'Windows'
        run: ./packaging/package.ps1
      - name: Check install, repair, uninstall and portable database
        if: runner.os == 'Windows'
        run: ./packaging/smoke.ps1
      - name: Package validated candidate artifacts
        if: runner.os == 'Windows'
        run: ./packaging/finish.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os == 'Windows'
        with:
          name: OWGuide-Windows-development-candidate
          path: |
            release/*.exe
            release/*.msi
            release/*.zip
            release/*.json
            release/*.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: checks-${{ matrix.os }}
          path: |
            dependency-licenses.json
            rust-licenses.json
            test-results/
          if-no-files-found: ignore
